[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nearlossless-context"
version = "0.2.0"
description = "Training-free long-context KV compression under fixed VRAM"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Nils Persson Suorra" },
]
keywords = [
  "large-language-models",
  "kv-cache",
  "long-context",
  "pytorch",
  "transformers",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4.0",
  "transformers>=4.57.1,<5",
  "accelerate>=1.0.0",
  "sentencepiece>=0.2.0",
  "protobuf>=4.25.0",
  "safetensors>=0.4.0",
  "numpy>=1.26.0",
  "tqdm>=4.66.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8.0"]
test = ["pytest>=8.0"]

[project.scripts]
nearlossless-example = "nearlossless_context.example:main"

[project.urls]
Homepage = "https://github.com/nilsperssonsuorra/nearlossless-context"
Repository = "https://github.com/nilsperssonsuorra/nearlossless-context"
Documentation = "https://github.com/nilsperssonsuorra/nearlossless-context/blob/main/USAGE.md"
Paper = "https://doi.org/10.5281/zenodo.21894255"
Issues = "https://github.com/nilsperssonsuorra/nearlossless-context/issues"
Changelog = "https://github.com/nilsperssonsuorra/nearlossless-context/releases"

[tool.setuptools]
packages = ["nearlossless_context"]
package-dir = { nearlossless_context = "experiments" }
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
nearlossless_context = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
